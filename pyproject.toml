[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "FoundationStereo"
version = "0.0.1"
description = "FoundationStereo: Zero-Shot Stereo Matching"
readme = "readme.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

dependencies = [
    # CUDA 12.8 builds; install with:
    #   pip install -e . --extra-index-url https://download.pytorch.org/whl/cu128
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy",
    "scikit-image",
    "omegaconf",
    "opencv-contrib-python",
    "imgaug",
    "ninja",
    "timm",
    "albumentations",
    "matplotlib",
    "pandas",
    "scipy",
    "joblib",
    "scikit-learn",
    "ruamel.yaml",
    "trimesh",
    "pyyaml",
    "imageio",
    "open3d",
    "transformations",
    "einops",
    "gdown",
    "huggingface-hub",
]

[project.optional-dependencies]
# xformers must match the installed torch version. dinov2 layers fall back to
# non-xformers paths when it's missing, so it's optional. Set XFORMERS_DISABLED=1
# to force the fallback path even when xformers is installed.
xformers = ["xformers"]
# flash-attn must be built against the installed torch and CUDA toolkit;
# install separately with: pip install flash-attn --no-build-isolation
flash-attn = ["flash-attn"]


[tool.setuptools]
py-modules = ["Utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "depth_anything*", "dinov2*"]
exclude = ["assets*", "docker*", "scripts*", "teaser*"]
